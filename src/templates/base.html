<!doctype html>
<html>
  <head>
    <title>{% block title %}{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/app.css' %}" />
    
    {{ vite.init|safe }}
    <link rel="stylesheet" href="{{ vite|asset:'assets/css/app.css' }}">
    <script type="module" src="{{ vite|asset:'assets/js/entrypoints/app.ts' }}"></script>
  </head>
  <body>
    <div class="p-10 bg-slate-200">
      <a href="/" class="app-link-normal">Home</a>
      <a href="/tweet" class="app-link-normal">Tweet</a>

      {% if user.is_authenticated %}
        <span>ようこそ {{ user.username }} さん</span>
        <a href="{% url 'logout' %}" class="app-link-normal">Logout</a>
      {% else %}
        <a href="{% url 'login' %}" class="app-link-normal">Login</a>
      {% endif %}
    </div>

    <div class="p-5">{% block content %}{% endblock %}</div>
  </body>
</html>
