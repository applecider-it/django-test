<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}{% endblock %}</title>
</head>
<body>

<nav>
    <a href="/">Home</a>
    <a href="/tweet">Tweet</a>

    {% if user.is_authenticated %}
        <span>ようこそ {{ user.username }} さん</span>
        <a href="{% url 'logout' %}">Logout</a>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
    {% endif %}
</nav>

<hr>

{% block content %}{% endblock %}

</body>
</html>
