{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}

{{ vite|import_js:'assets/js/entrypoints/development/javascript-test.ts'|safe }}

{% load static %}

<h2 class="app-h2">開発者向けページ</h2>

<div id="vue" data-all="{{ data_json }}"></div>

<div class="swiper-container swiper-container1">
    <div class="swiper swiper1">
        <div class="swiper-wrapper">
            {% for val in list %}
                <div class="swiper-slide">
                    <img src="{% static val %}" alt="" class="mx-auto" />
                </div>
            {% endfor %}
        </div>

        <div class="swiper-pagination swiper-pagination1"></div>
    </div>
</div>

{% endblock %}
